<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | InternHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            background: #f6f8fc;
        }

        .admin-auth {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .admin-card {
            width: 100%;
            max-width: 430px;

            background: white;
            border: 1px solid #e5e7ee;
            border-radius: 22px;

            padding: 42px;

            box-shadow:
                0 25px 70px rgba(25,35,70,.09);
        }

        .admin-logo {
            text-align: center;
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 28px;
        }

        .admin-logo span {
            color: #635bff;
        }

        .admin-badge {
            width: fit-content;
            margin: auto;
            padding: 7px 13px;

            border-radius: 20px;

            background: #eeecff;
            color: #635bff;

            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .admin-card h1 {
            text-align: center;
            margin: 18px 0 7px;

            font-size: 27px;
            letter-spacing: -.8px;
        }

        .admin-subtitle {
            text-align: center;
            color: #858d9d;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .admin-form-group {
            margin-bottom: 18px;
        }

        .admin-form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;
            font-weight: 700;
            color: #3d4555;
        }

        .admin-form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #dfe3eb;
            border-radius: 10px;

            background: #fafbfc;

            outline: none;

            font-size: 13px;
        }

        .admin-form-group input:focus {
            border-color: #635bff;
            background: white;

            box-shadow:
                0 0 0 3px rgba(99,91,255,.10);
        }

        .admin-submit {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 10px;

            background: #635bff;
            color: white;

            font-size: 13px;
            font-weight: 800;

            cursor: pointer;

            margin-top: 8px;
        }

        .admin-submit:hover {
            background: #5148e8;
        }

        .admin-links {
            text-align: center;
            margin-top: 22px;

            font-size: 12px;
            color: #858d9d;
        }

        .admin-links a {
            color: #635bff;
            font-weight: 700;
        }

        .alert {
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 12px;
            font-weight: 600;
        }

        .alert.error {
            background: #fff0f0;
            color: #d94242;
        }

        .alert.success {
            background: #e8f8ef;
            color: #16804a;
        }

    </style>
</head>

<body>

<div class="admin-auth">

    <div class="admin-card">

        <div class="admin-logo">
            Intern<span>Hub</span>
        </div>

        <div class="admin-badge">
            ADMIN PORTAL
        </div>

        <h1>
            Welcome back
        </h1>

        <p class="admin-subtitle">
            Sign in to manage internships and applications.
        </p>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="alert {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form method="POST">

            <div class="admin-form-group">

                <label>Email address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="admin@example.com"
                    required>

            </div>


            <div class="admin-form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="admin-submit">

                Sign In

            </button>

        </form>


        <div class="admin-links">

            Don't have an admin account?

            <a href="{{ url_for('admin_register') }}">
                Register
            </a>

            <br><br>

            <a href="{{ url_for('index') }}">
                ← Back to InternHub
            </a>

        </div>

    </div>

</div>

</body>
</html>
