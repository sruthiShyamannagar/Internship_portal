<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Registration | InternHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            background: #f6f8fc;
        }

        .register-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .register-card {
            width: 100%;
            max-width: 470px;

            background: white;

            border: 1px solid #e5e7ee;

            border-radius: 22px;

            padding: 40px;

            box-shadow:
                0 25px 70px rgba(25,35,70,.09);
        }

        .logo {
            text-align: center;

            font-size: 27px;
            font-weight: 800;

            margin-bottom: 20px;
        }

        .logo span {
            color: #635bff;
        }

        .badge {
            width: fit-content;

            margin: auto;

            padding: 7px 13px;

            border-radius: 20px;

            background: #eeecff;
            color: #635bff;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 1px;
        }

        h1 {
            text-align: center;

            font-size: 27px;

            margin: 17px 0 7px;
        }

        .subtitle {
            text-align: center;

            color: #858d9d;

            font-size: 13px;

            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #dfe3eb;

            border-radius: 10px;

            background: #fafbfc;

            outline: none;

            font-size: 13px;
        }

        .form-group input:focus {
            border-color: #635bff;

            background: white;

            box-shadow:
                0 0 0 3px rgba(99,91,255,.10);
        }

        .submit {
            width: 100%;

            border: none;

            padding: 14px;

            margin-top: 8px;

            border-radius: 10px;

            background: #635bff;

            color: white;

            font-size: 13px;
            font-weight: 800;

            cursor: pointer;
        }

        .submit:hover {
            background: #5148e8;
        }

        .bottom {
            text-align: center;

            margin-top: 22px;

            color: #858d9d;

            font-size: 12px;
        }

        .bottom a {
            color: #635bff;
            font-weight: 700;
        }

        .alert {
            padding: 12px;

            border-radius: 9px;

            margin-bottom: 18px;

            font-size: 12px;
            font-weight: 600;
        }

        .alert.error {
            background: #fff0f0;
            color: #d94242;
        }

        .alert.success {
            background: #e8f8ef;
            color: #16804a;
        }

    </style>

</head>


<body>

<div class="register-page">

    <div class="register-card">

        <div class="logo">
            Intern<span>Hub</span>
        </div>

        <div class="badge">
            ADMIN PORTAL
        </div>

        <h1>
            Create admin account
        </h1>

        <p class="subtitle">
            Set up your account to manage the internship portal.
        </p>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="alert {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form method="POST">

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="admin@example.com"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required>

            </div>


            <button
                type="submit"
                class="submit">

                Create Admin Account

            </button>

        </form>


        <div class="bottom">

            Already have an account?

            <a href="{{ url_for('admin_login') }}">
                Login
            </a>

            <br><br>

            <a href="{{ url_for('index') }}">
                ← Back to InternHub
            </a>

        </div>

    </div>

</div>

</body>
</html>
