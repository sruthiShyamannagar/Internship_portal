<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | InternHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .login-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                radial-gradient(circle at 10% 20%, #e5e2ff, transparent 30%),
                radial-gradient(circle at 90% 80%, #ddf6ff, transparent 30%),
                #f7f8fc;
        }

        .login-card {
            width: 100%;
            max-width: 460px;

            background: white;

            padding: 45px;

            border-radius: 24px;

            border: 1px solid #e7e9f0;

            box-shadow:
                0 25px 70px rgba(30,35,80,.11);
        }

        .login-logo {
            font-size: 25px;
            font-weight: 800;

            margin-bottom: 45px;
        }

        .login-logo span {
            color: #635bff;
        }

        .login-icon {
            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: #eeecff;
            color: #635bff;

            font-size: 21px;

            margin-bottom: 20px;
        }

        .login-card h1 {
            font-size: 29px;
            letter-spacing: -1px;
            margin-bottom: 7px;
        }

        .login-subtitle {
            color: #81899a;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .login-group {
            margin-bottom: 18px;
        }

        .login-group label {
            display: block;

            font-size: 12px;
            font-weight: 700;

            color: #353c4c;

            margin-bottom: 7px;
        }

        .login-group input {
            width: 100%;

            padding: 14px;

            border: 1px solid #dfe2e9;
            border-radius: 10px;

            background: #fafbfc;

            outline: none;

            font-size: 13px;
        }

        .login-group input:focus {
            border-color: #635bff;
            background: white;

            box-shadow:
                0 0 0 3px rgba(99,91,255,.1);
        }

        .login-submit {
            width: 100%;

            border: none;
            border-radius: 10px;

            padding: 14px;

            background: #635bff;
            color: white;

            font-size: 13px;
            font-weight: 800;

            margin-top: 5px;

            box-shadow:
                0 10px 25px rgba(99,91,255,.25);
        }

        .login-submit:hover {
            background: #5148e8;
        }

        .login-alert {
            padding: 11px 13px;
            border-radius: 9px;

            margin-bottom: 18px;

            background: #fff0f0;
            color: #d83d3d;

            font-size: 12px;
            font-weight: 600;
        }

        .login-bottom {
            text-align: center;

            color: #81899a;

            font-size: 12px;

            margin-top: 24px;
        }

        .login-bottom a {
            color: #635bff;
            font-weight: 700;
        }

        .login-home {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #81899a;
            font-size: 12px;
        }

        .login-home:hover {
            color: #635bff;
        }
    </style>
</head>


<body>


<div class="login-page">

    <div class="login-card">


        <div class="login-logo">
            Intern<span>Hub</span>
        </div>


        <div class="login-icon">
            🎓
        </div>


        <h1>
            Welcome back
        </h1>

        <p class="login-subtitle">
            Login to continue your internship journey.
        </p>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="login-alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form method="POST">


            <div class="login-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    required>

            </div>


            <div class="login-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="login-submit">

                Login to InternHub →

            </button>

        </form>


        <div class="login-bottom">

            Don't have an account?

            <a href="{{ url_for('student_register') }}">
                Create one
            </a>

        </div>


        <a href="{{ url_for('index') }}"
           class="login-home">

            ← Back to home

        </a>

    </div>

</div>


</body>
</html>
